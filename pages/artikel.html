     LENTERA JIWA — pages/artikel.html
     Daftar artikel diambil dari server (Google Sheets + Google Docs).
     ══════════════════════════════════════════════════════════ -->

<header class="artikel-page-header">
  <div class="container">
    <div class="section-tag reveal" style="justify-content:center;">📝 Konten &amp; Edukasi</div>
    <h1 class="section-title reveal" style="text-align:center;">
      Artikel untuk <em>Setiap</em> Jiwa
    </h1>
    <p class="section-intro reveal" style="text-align:center;margin:0 auto;">
      Ditulis atau ditinjau tim Lentera Jiwa, disesuaikan untuk setiap kelompok usia. Konten bersifat edukatif dan tidak menggantikan konsultasi profesional.
    </p>
  </div>
</header>

<section class="section" style="padding-top:0;" aria-labelledby="artikel-list-heading">
  <div class="container">
    <h2 id="artikel-list-heading" class="sr-only">Daftar Artikel</h2>

    <div class="filter-bar reveal" role="toolbar" aria-label="Filter artikel" id="artikel-filter">
      <button class="filter-btn is-active" data-filter="semua" aria-pressed="true">Semua</button>
      <button class="filter-btn" data-filter="anak" aria-pressed="false">🌱 Anak</button>
      <button class="filter-btn" data-filter="remaja" aria-pressed="false">🌙 Remaja</button>
      <button class="filter-btn" data-filter="dewasa" aria-pressed="false">☀️ Dewasa</button>
      <button class="filter-btn" data-filter="lansia" aria-pressed="false">🌸 Lansia</button>
    </div>

    <p id="artikel-count" class="sr-only" aria-live="polite"></p>
    <div class="artikel-grid" id="artikel-grid" role="list" aria-label="Daftar artikel" aria-busy="true">
      <div class="artikel-card" style="min-height:160px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);">Memuat artikel…</div>
    </div>
  </div>
</section>

<div id="article-overlay" class="article-overlay" aria-hidden="true"></div>

<aside id="article-drawer"
       class="article-drawer"
       role="dialog"
       aria-modal="true"
       aria-labelledby="article-drawer-title"
       aria-hidden="true">
  <header class="article-drawer-header">
    <div class="article-read-time">
      <span id="article-drawer-tag" class="artikel-tag" style="margin-bottom:0;"></span>
      <span id="article-drawer-time"></span>
    </div>
    <button id="article-close" class="article-close-btn" aria-label="Tutup artikel">✕</button>
  </header>
  <div class="article-progress-bar" aria-hidden="true">
    <div id="article-progress-fill" class="article-progress-fill"></div>
  </div>
  <div class="article-body" id="article-content" tabindex="-1"></div>
</aside>
